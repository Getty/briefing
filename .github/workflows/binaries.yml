name: binaries
on:
  release:
    types: [published]
  # TEMPORARY: probe run on the ack-paket branch, because workflow_dispatch only
  # works for workflows on the default branch; remove before merging to main.
  push:
    branches: [ack-paket]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach; empty = probe run
        required: false
jobs:
  binaries:
    permissions:
      contents: write
    uses: Getty/p5-dist-zilla-pluginbundle-author-getty/.github/workflows/dzil-binary.yml@binary-v1
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
