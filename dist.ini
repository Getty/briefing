name = App-Briefing
author = Torsten Raudssus <getty@cpan.org>
license = Artistic_2_0
copyright_holder = Torsten Raudssus <torsten@raudssus.de> L<https://raudssus.de/>
copyright_year = 2026
main_module = lib/App/Briefing.pm

[@Author::GETTY]
; bin/ holds the plugin: the briefing starter (a shell script, not the CPAN program), the
; old doctor launchers and their Windows .exe files. The CPAN program briefing lives in
; script/ (see [ExecDir] below); the pinned binary checksums are not a dist file.
gather_exclude_match = ^bin/

; The standalone binary of script/briefing, packed by the bundle after every dzil build and,
; per platform, by its dzil-binary workflow (.github/workflows/binaries.yml) as assets of the
; GitHub release: briefing-<VERSION>-<PLATFORM>, SHA256SUMS. The starter bin/briefing downloads
; them. The binary comes from the explicit subsection below (script/briefing, not bin/briefing),
; so the automatic one of `binary` is off. scripts/ holds the hooks: pp arguments (the -M set
; pp's scan cannot see), verify (against `perl -Ilib script/briefing`) and the clean-machine smoke
; (incl. Unicode paths). TLS is not needed, so no OpenSSL; the glibc floor is the bundle's.
binary           = briefing
binary_default   = 0
binary_platforms = linux-x86_64 linux-arm64 macos-arm64 macos-x86_64 windows-x86_64
binary_pp_args   = bash scripts/binary-pp-args.sh
binary_verify    = bash scripts/binary-verify.sh
binary_smoke     = bash scripts/binary-smoke.sh
binary_require   = App::Briefing App::Briefing::CLI App::Briefing::Team Moo Path::Tiny
binary_require   = JSON::MaybeXS TOML::Tiny::Parser namespace::clean

[@Author::GETTY::Binary / briefing]
script = script/briefing

; Dist::Zilla installs from bin/ by default; the program is in script/.
[ExecDir]
dir = script

[DynamicPrereqs]
-delimiter = |
-raw = |require Module::CPANfile;
-raw = |my $dynamic_prereqs = Module::CPANfile->load('cpanfile')->prereq_specs;
-raw = |my $runtime_requires = $dynamic_prereqs->{runtime}{requires} || {};
-raw = |$WriteMakefileArgs{PREREQ_PM} ||= {};
-raw = |for my $module (keys %{$runtime_requires}) {
-raw = |  $WriteMakefileArgs{PREREQ_PM}{$module} = $runtime_requires->{$module};
-raw = |  $FallbackPrereqs{$module} = $runtime_requires->{$module};
-raw = |}
